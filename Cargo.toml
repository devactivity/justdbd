[package]
name = "justdb"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
bincode = { version = "2.0.1", features = ["serde"] }
blake3 = "1.8.2"
bytes = "1.10.1"
clap = { version = "4.5.48", features = ["derive"] }
crc32fast = "1.5.0"
crossbeam-channel = "0.5.15"
lz4_flex = { version = "0.11.5", optional = true}
memmap2 = "0.9.8"
parking_lot = "0.12.4"
rand = "0.9.2"
rmp-serde = "1.3.0"
serde = { version = "1.0.219", features = ["derive"] }
tempfile = "3.22.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
zstd = {version = "0.13.3", optional = true}

[features]
default = ["compression"]
compression = ["lz4_flex", "zstd"]

[[bin]]
name = "justdbd"
path = "src/bin/cli.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
